[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curriculum-planner"
version = "0.1.0"
description = "Lập lộ trình học tập cá nhân hóa (RCPSP-SMTW) bằng OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.12",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-bdd>=7",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
cplan = "curriculum_planner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curriculum_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
bdd_features_base_dir = "tests/acceptance/features"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

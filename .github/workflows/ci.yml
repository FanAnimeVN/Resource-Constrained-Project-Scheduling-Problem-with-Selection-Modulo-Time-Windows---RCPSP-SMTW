name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: pip install -e "backend[dev]"
      - name: Lint
        run: |
          ruff check backend/src backend/tests
          ruff format --check backend/src backend/tests
      - name: Kiểm tra dữ liệu mẫu
        run: cplan validate hcmus_cntt_k2020
      - name: Kiểm thử (unit, property, BDD AC-01..AC-07, API)
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài đặt
        working-directory: frontend
        run: npm ci
      - name: Kiểm tra kiểu, vitest, build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
